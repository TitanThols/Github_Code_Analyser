# Render Blueprint: New + > Blueprint, select this repository, Apply.
# Provisions a Postgres database and the Docker web service, wired together.
databases:
  - name: depscan-db
    plan: free
    databaseName: depscan
    user: depscan

services:
  - type: web
    name: depscan
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: depscan-db
          property: connectionString
      - key: GithubApi__Token
        sync: false # optional: paste a GitHub token in the Render dashboard
      - key: Hangfire__WorkerCount
        value: "2"
