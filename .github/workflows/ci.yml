name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · build, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DepScan.slnx
      - run: dotnet tool restore
      - run: dotnet build DepScan.slnx --no-restore -c Release -warnaserror
      - name: Test
        run: >
          dotnet test DepScan.slnx --no-build -c Release
          --settings coverlet.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults
      - name: Coverage report
        run: |
          dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:TestResults/coverage \
            -reporttypes:"MarkdownSummaryGithub;Html" -classfilters:"-*Migrations*"
          cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: TestResults/coverage

  frontend:
    name: Frontend · lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oss-analyser-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: oss-analyser-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Coverage summary
        run: |
          node -e "const s=require('./coverage/coverage-summary.json').total; const row=k=>'| '+k+' | '+s[k].pct+'% |'; console.log(['### Frontend coverage','| Metric | % |','|---|---|',row('lines'),row('statements'),row('branches'),row('functions')].join('\n'))" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: depscan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
